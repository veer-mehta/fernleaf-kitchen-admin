packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true # needed by tsx (runs the seed script)
  unrs-resolver: false # optional native speed-up for ESLint; not needed
  sharp: false # Next image optimiser; this admin panel does not use it
