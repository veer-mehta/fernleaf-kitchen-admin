services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen
      POSTGRES_DB: kitchen
    ports:
      # 5432 unless POSTGRES_PORT is set in .env (for a machine that already runs its own PostgreSQL)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # dev-only credentials; the port is bound to localhost so nothing outside this machine can reach it
      # runs once on first start: creates the separate test database
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
